apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-app-label
spec:
  evaluation:
    admission:
      enabled: true
    background:
      enabled: true

  matchConstraints:
    resourceRules:
      - apiGroups:
          - ""
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
        resources:
          - pods

  validationActions:
    - Deny

  validations:
    - expression: >-
        object.metadata.namespace in [
          'kube-system',
          'kyverno',
          'kube-public',
          'kube-node-lease'
        ] ||
        (
          has(object.metadata.labels) &&
          'app' in object.metadata.labels &&
          object.metadata.labels['app'] != ''
        )
      message: >-
        Every application Pod must have a non-empty app label.
