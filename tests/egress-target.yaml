apiVersion: v1
kind: Pod
metadata:
  name: egress-target
  namespace: security-lab
  labels:
    app: egress-target
spec:
  containers:
    - name: nginx
      image: nginx:1.27-alpine
      ports:
        - name: http
          containerPort: 80
      resources:
        requests:
          cpu: 50m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: egress-target-service
  namespace: security-lab
spec:
  type: ClusterIP
  selector:
    app: egress-target
  ports:
    - name: http
      port: 80
      targetPort: 80
