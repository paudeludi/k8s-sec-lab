apiVersion: v1
kind: Pod
metadata:
  name: pod-compliant
  namespace: security-lab
  labels:
    app: policy-test
spec:
  containers:
    - name: test
      image: nginx:1.27-alpine
      ports:
        - name: http
          containerPort: 80
      resources:
        requests:
          cpu: 50m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 64Mi
