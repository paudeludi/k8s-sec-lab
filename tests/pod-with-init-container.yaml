apiVersion: v1
kind: Pod
metadata:
  name: pod-with-init-container
  namespace: security-lab
  labels:
    app: policy-test
spec:
  initContainers:
    - name: init
      image: busybox:1.36
      command: ["sh", "-c", "echo init-complete"]
      resources:
        requests:
          cpu: 10m
          memory: 8Mi
        limits:
          cpu: 50m
          memory: 16Mi
  containers:
    - name: app
      image: nginx:1.27-alpine
      resources:
        requests:
          cpu: 50m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 64Mi
