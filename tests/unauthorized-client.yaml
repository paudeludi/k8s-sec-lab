apiVersion: v1
kind: Pod
metadata:
  name: unauthorized-client
  namespace: security-lab
  labels:
    app: unauthorized-client
spec:
  containers:
    - name: curl
      image: curlimages/curl:8.12.1
      command: ["sh", "-c", "sleep 360000"]
      resources:
        requests:
          cpu: 50m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 64Mi
