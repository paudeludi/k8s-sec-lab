apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: security-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        # The frontend application serves HTTP on port 80.
        - name: frontend-web
          image: nginx:1.27-alpine
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
        # This sidecar is the in-Pod curl client used for the lab tests.
        - name: curl
          image: curlimages/curl:8.12.1
          command: ["sh", "-c", "sleep 360000"]
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: security-lab
spec:
  type: ClusterIP
  selector:
    app: frontend
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 80
